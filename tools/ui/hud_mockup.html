<!doctype html>
<!--
  HUD 글자 체계 목업 (10/10 — docs/ui/hud_type_system_2026-10-10.md)
  실제 게임 배경 캡처(docs/ui/hud_bg_<방향>.png — 글자만 숨긴 화면, 일시정지 단추·조이스틱은 그대로) 위에 새 체계의 글자를 HTML 로 얹는다.
  주소: hud_mockup.html?o=portrait|landscape&scene=hud|map|cards|menu|swatch
    hud    — 싸움 중 모든 역할을 한꺼번에 (실제로는 동시에 다 뜨지 않는다)
    map    — 화면 지도 (역할 칸의 자리와 크기)
    cards  — 무기 카드 화면 (앞면 세 장 + 상대 소개)
    menu   — 설정·일시정지·결과 창
    swatch — 오렌지 후보를 실제 배경(하늘·모래·돌기둥) 위에
  찍기: node tools/ui/hud_shots.mjs mockup - docs/ui
  글은 편집자 문구 정리(10/10) 뒤의 게임 문구와 짜임(첫 줄 한국어 · 둘째 줄 원어 · 꼬리표 `[내|상대] 유파 · 종류`)을 따른다. 여기 :root 토큰이 구현할 때 index.html :root 로 옮길 값이다.
-->
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HUD 목업</title>
<style>
  :root {
    /* ── 글꼴 묶음: 시스템 글꼴 (웹폰트 없음 — 스펙 '글꼴') ── */
    --font-ui: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    /* ── 크기 4 단계 ── */
    --fs-display: clamp(32px, 9vmin, 56px); /* 판 알림 (Battle·승리·패배) */
    --fs-title: 20px;                       /* 캐릭터 이름 · 상태(경직) · 창 제목 · 큰 카드 무기 이름 */
    --fs-body: 15px;                        /* 칸의 첫 줄(자세·패시브·비기 이름) · 대사 · 알림 줄 · 메뉴 줄 · 단추 */
    --fs-caption: 12px;                     /* 칸의 둘째 줄(설명·꼬리표) · 칭호 · 안내 · 카드 설명 · 배지 */
    --lh-tight: 1.25;
    --lh-text: 1.4;
    --ls-display: .06em;
    --ls-label: .04em;
    /* ── 외곽선 표준 하나 (모든 HUD 글자) ── */
    --outline-c: #0d0907;
    --hud-outline: 1px 0 0 var(--outline-c), -1px 0 0 var(--outline-c), 0 1px 0 var(--outline-c), 0 -1px 0 var(--outline-c), 0 1px 3px rgba(13, 9, 7, .85), 0 0 8px rgba(13, 9, 7, .5);
    --hud-outline-display: 0 2px 0 var(--outline-c), 0 0 2px var(--outline-c), 0 3px 10px rgba(13, 9, 7, .7);
    /* ── 색 토큰 ── */
    --hud-guard: #f3e6c8;      /* 자세 이름 (지금 색 그대로) */
    --hud-guard-sub: #e4d8bf;  /* 자세 설명 (지금 색 그대로) */
    --hud-tech: #c8714e;       /* 패시브·고유 동작 이름 — 견본 #B96648 계열, 한 단계 밝게 (외곽선 대비 5.6) */
    --hud-tech-sub: #e3a382;   /* 기술 칸 꼬리표 */
    --hud-secret: #de7c46;     /* 비기 이름 — 같은 계열, 더 붉고 밝게 */
    --hud-name: #f3e6c8;       /* 캐릭터 이름 */
    --hud-epithet: #d9c9a6;    /* 칭호 */
    --hud-line: #efe3c8;       /* 대사 */
    --hud-sys: #f3e9d8;        /* 판 알림 */
    --hud-state: #b9c7d6;      /* 상태 (경직) */
    --hud-guide: #e2d6bf;      /* 안내 */
    --hud-guide-bg: rgba(13, 9, 7, .5);
    --emo-fear: #b9c8de;
    --emo-anger: #f0604c;
    --emo-obsession: #f2c75a;
    --emo-revive: #fff1c8;
    /* 무기 등급 (지금 값 그대로 — 의미 있는 색) */
    --tier-trash: #b8b6b0; --tier-common: #fff3c4; --tier-rare: #8cc4ff; --tier-epic: #d6a8ff; --tier-legend: #ffd24a; --tier-mystery: #8fe3c6;
    /* 창 (메뉴·카드 판) */
    --ink: #f3e9d8; --dim: #b8a88e; --panel: rgba(24, 18, 14, .9); --line: rgba(243, 233, 216, .18); --accent: #d9a441; --foe: #b0473b;
    /* ── 자리 ── */
    --safe-t: max(12px, env(safe-area-inset-top));
    --safe-r: max(14px, env(safe-area-inset-right));
    --safe-l: max(14px, env(safe-area-inset-left));
    --safe-b: max(12px, env(safe-area-inset-bottom));
    --side-w: min(34vw, 300px);       /* 왼쪽 위·오른쪽 위 칸 폭 (가로) */
    --slot-gap: 6px;
    --hint-b: var(--safe-b);
    --notice-up: 34px;             /* 알림 줄은 안내 위로 이만큼 (세로는 안내가 두 줄이라 더) */
  }
  @media (orientation: portrait) {
    :root { --side-w: calc(50vw - 19px - 24px); --hint-b: calc(var(--safe-b) + 130px); --notice-up: 54px; } /* 가운데 일시정지 단추(38px) 양옆 10px · 안내는 조이스틱(아래 20+110px) 위로 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1410; color: var(--ink); font-family: var(--font-ui); }
  #bg { position: fixed; inset: 0; background-size: 100% 100%; }
  .hud { position: fixed; pointer-events: none; text-shadow: var(--hud-outline); }

  /* ── 칸 하나 = 첫 줄(이름) + 둘째 줄(설명·꼬리표). 자세·패시브·비기 모두 같은 서식, 색만 다르다 ── */
  .slot b { display: block; font-size: var(--fs-body); font-weight: 800; line-height: var(--lh-tight); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .slot small { display: block; font-size: var(--fs-caption); font-weight: 500; line-height: 1.35; margin-top: 1px; letter-spacing: .01em; word-break: keep-all;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  /* 오른쪽 위: 고정 칸 셋 (비어도 자리는 그대로 — 아래 칸이 위로 뛰지 않는다) */
  #rstack { top: var(--safe-t); right: var(--safe-r); width: var(--side-w); text-align: right; }
  #rstack .slot { height: 40px; margin-top: var(--slot-gap); }
  #rstack .slot.guard { height: 52px; margin-top: 0; }
  .slot.guard b { color: var(--hud-guard); } .slot.guard small { color: var(--hud-guard-sub); }
  .slot.tech b { color: var(--hud-tech); } .slot.tech small { color: var(--hud-tech-sub); -webkit-line-clamp: 1; }
  .slot.secret b { color: var(--hud-secret); } .slot.secret small { color: var(--hud-tech-sub); -webkit-line-clamp: 1; }
  .slot.arm { opacity: .6; } /* 준비 상태 (고노센 준비) — 같은 칸, 흐리게 */

  /* 왼쪽 위: 인물 (이름 · 칭호 · 대사 · 안내) — 오른쪽 위와 거울 */
  #lstack { top: var(--safe-t); left: var(--safe-l); width: var(--side-w); text-align: left; }
  #lstack .nm { font-size: var(--fs-title); font-weight: 800; line-height: var(--lh-tight); color: var(--hud-name); }
  #lstack .ep { font-size: var(--fs-caption); font-weight: 500; color: var(--hud-epithet); margin-left: 6px; letter-spacing: var(--ls-label); }
  #lstack .ln { margin-top: 4px; font-size: var(--fs-body); font-weight: 500; line-height: var(--lh-text); color: var(--hud-line); display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; word-break: keep-all; }
  #lstack .gd { margin-top: 6px; word-break: keep-all; font-size: var(--fs-caption); font-weight: 700; color: var(--accent); letter-spacing: var(--ls-label); }
  @media (orientation: portrait) { #lstack .ep { display: block; margin: 1px 0 0; } }

  /* 상태 (경직): 가운데 위 — 상대 머리 위쯤 */
  #state { left: 50%; top: 30%; transform: translate(-50%, -50%); font-size: var(--fs-title); font-weight: 800; letter-spacing: .2em; color: var(--hud-state); white-space: nowrap; }
  /* 판 알림 */
  #display { left: 50%; top: 46%; transform: translate(-50%, -50%); font-size: var(--fs-display); font-weight: 800; letter-spacing: var(--ls-display); color: var(--hud-sys); text-shadow: var(--hud-outline-display); white-space: nowrap; }
  /* 알림 줄 (감정·부활·센서 같은 한 줄 알림): 아래 가운데, 안내 위 */
  #notice { left: 50%; bottom: calc(var(--hint-b) + var(--notice-up)); transform: translateX(-50%); font-size: var(--fs-body); font-weight: 700; white-space: nowrap; max-width: min(64vw, 480px); overflow: hidden; text-overflow: ellipsis; }
  #notice[data-emotion='anger'] { color: var(--emo-anger); }
  /* 안내 (조작 안내): 아래 가운데, 알약 바탕 — 바탕이 있으니 외곽선 없음 */
  #hint { left: 50%; bottom: var(--hint-b); transform: translateX(-50%); font-size: var(--fs-caption); font-weight: 500; color: var(--hud-guide); background: var(--hud-guide-bg); padding: 6px 12px; border-radius: 999px; text-shadow: none; white-space: nowrap; max-width: min(64vw, 520px); overflow: hidden; text-overflow: ellipsis; }
  @media (orientation: portrait) { #hint { white-space: normal; text-align: center; width: max-content; max-width: calc(100vw - 2 * var(--safe-l)); } }

  /* ── 화면 지도 ── */
  .zone { position: fixed; border: 1.5px dashed rgba(255, 255, 255, .85); background: rgba(13, 9, 7, .35); color: #fff; font: 700 11px/1.3 var(--font-ui); padding: 3px 5px; text-shadow: 0 1px 2px #000; }
  .zone.k { border-color: #ffd24a; } .zone.o { border-color: #e3a382; } .zone.b { border-color: #8cc4ff; } .zone.x { border-color: rgba(255,255,255,.5); border-style: dotted; background: rgba(255,255,255,.08); }

  /* ── 카드 화면 ── */
  #dim { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 62%, rgba(16,10,6,.62), rgba(16,10,6,.28) 72%); }
  .row3 { position: fixed; left: var(--safe-l); right: var(--safe-r); bottom: var(--safe-b); display: flex; align-items: center; justify-content: center; gap: 12px; }
  .wface { position: relative; flex: none; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8px 9px 10px; border-radius: 10px; border: 1px solid var(--tc);
    background: linear-gradient(172deg, #30241a, #17110c 70%); box-shadow: 0 8px 20px rgba(0,0,0,.5); }
  .wface.picked { box-shadow: 0 0 0 2px var(--accent), 0 10px 26px rgba(0,0,0,.55); }
  .wface.foe { box-shadow: 0 0 0 2px var(--foe), 0 10px 26px rgba(0,0,0,.55); }
  .wface.missed { opacity: .7; transform: scale(.94); }
  .pill { display: inline-block; font-size: var(--fs-caption); font-weight: 700; letter-spacing: var(--ls-label); line-height: 1; padding: 3px 8px 2px; border-radius: 999px; }
  .wwho { color: #1b1410; background: var(--accent); } .foe .wwho { color: #fbe9e2; background: #93372d; }
  .wthumb { flex: 1 1 auto; width: 70%; min-height: 30px; margin: 6px 0; border-radius: 6px; background: radial-gradient(circle, rgba(255,255,255,.08), rgba(255,255,255,0) 70%); }
  .wname { font-size: var(--fs-body); font-weight: 800; line-height: var(--lh-tight); color: var(--tc); word-break: keep-all; }
  .wide .wname { font-size: var(--fs-title); }
  .wsub { font-size: var(--fs-caption); color: #cfc0a2; margin-top: 1px; }
  .wtier { color: var(--tc); border: 1px solid var(--tc); margin: 5px 0; background: transparent; }
  .wdesc { font-size: var(--fs-caption); line-height: var(--lh-text); color: #ece1cb; word-break: keep-all; text-wrap: balance; }
  .wide .wdesc { font-size: var(--fs-body); }
  .wabil { font-size: var(--fs-caption); line-height: var(--lh-text); color: var(--tc); margin-top: 2px; }
  .wide .wabil { font-size: var(--fs-body); }

  /* ── 창 (설정·일시정지·결과) ── */
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(27,20,16,.55), rgba(27,20,16,.92)); }
  .card { width: min(460px, 100%); max-height: 100%; overflow: hidden; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; }
  .card h1 { margin: 0 0 4px; font-size: var(--fs-title); font-weight: 800; letter-spacing: var(--ls-label); }
  .card .sub { margin: 0 0 12px; font-size: var(--fs-body); line-height: var(--lh-text); color: var(--dim); }
  .rows { display: grid; grid-template-columns: 1fr; column-gap: 24px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 40px; border-top: 1px solid var(--line); font-size: var(--fs-body); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg span { padding: 6px 10px; font-size: var(--fs-caption); color: var(--dim); }
  .seg span.on { background: var(--accent); color: #1b1410; font-weight: 700; }
  .toggle { flex: none; width: 44px; height: 24px; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.4); position: relative; }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--dim); }
  .toggle.on { background: var(--accent); } .toggle.on::after { left: 22px; background: #1b1410; }
  .minor { color: var(--accent); font-size: var(--fs-caption); margin-left: 6px; }
  .primary { margin-top: 14px; padding: 12px; text-align: center; font-size: var(--fs-body); font-weight: 800; border-radius: 8px; background: var(--accent); color: #1b1410; }
  .secondary { margin-top: 8px; padding: 10px; text-align: center; font-size: var(--fs-body); border: 1px solid var(--line); border-radius: 8px; }
  @media (max-height: 500px) {
    .card { width: min(760px, 100%); padding: 12px 18px; }
    .rows { grid-template-columns: 1fr 1fr; }
    .row { min-height: 34px; }
    .acts { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; align-items: end; }
    .acts > * { margin-top: 10px; }
  }

  /* ── 오렌지 후보 ── */
  .sw { position: fixed; font-size: var(--fs-body); font-weight: 800; text-shadow: var(--hud-outline); white-space: nowrap; }
  .sw small { display: block; font-size: var(--fs-caption); font-weight: 500; }
  .sw.raw { text-shadow: none; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="root"></div>
<script>
  const q = new URLSearchParams(location.search);
  const o = q.get('o') || (innerWidth > innerHeight ? 'landscape' : 'portrait');
  const scene = q.get('scene') || 'hud';
  document.getElementById('bg').style.backgroundImage = `url(../../docs/ui/hud_bg_${o}.png)`;
  const root = document.getElementById('root');
  const H = (html) => root.insertAdjacentHTML('beforeend', html);
  const PORT = o === 'portrait';

  const rstack = (slots) => H(`<div class="hud" id="rstack" data-role="R 오른쪽 위">${slots}</div>`);
  const guard = `<div class="slot guard" data-role="R1 자세"><b>긴 자세</b><small>Langort · 팔을 쭉 뻗어 칼끝으로 겨눈 자세</small></div>`;
  const tech = `<div class="slot tech" data-role="R2 패시브·고유 동작"><b>따라 들어가기</b><small>Nachreisen · 상대 독일 · 패시브</small></div>`;
  const secret = `<div class="slot secret" data-role="R3 비기"><b>받아 베기</b><small>Versetzen · 상대 독일 · 비기</small></div>`;
  const lstack = (guide) => H(`<div class="hud" id="lstack" data-role="L 인물"><span class="nm">오소리 브란</span><span class="ep">나무꾼</span><div class="ln">“젠장! 이런 막대기 뿐이라니.”</div>${guide ? `<div class="gd">${guide}</div>` : ''}</div>`);

  if (scene === 'hud') {
    rstack(guard + tech + secret);
    lstack('');
    H(`<div class="hud" id="state" data-role="C 상태">상대 경직</div>`);
    H(`<div class="hud" id="display" data-role="D 판 알림">Battle</div>`);
    H(`<div class="hud" id="notice" data-emotion="anger" data-role="E 알림 줄">오소리 브란의 분노가 폭발한다</div>`);
    H(`<div class="hud" id="hint" data-role="H 안내">왼쪽 아래 조이스틱으로 걷기 · 나머지 화면을 끌어서 휘두르고 톡 쳐서 찌르기</div>`);
  }

  if (scene === 'map') {
    const W = innerWidth, Hh = innerHeight;
    const side = PORT ? W / 2 - 19 - 24 : Math.min(W * 0.34, 300);
    const z = (cls, x, y, w, h, label) => H(`<div class="zone ${cls}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px">${label}</div>`);
    z('x', W / 2 - 19, 8, 38, 38, '');
    z('k', W - 14 - side, 12, side, 52, 'R1 자세 (이름 · 설명 2줄)');
    z('o', W - 14 - side, 70, side, 40, 'R2 패시브 · 고유 동작');
    z('o', W - 14 - side, 116, side, 40, 'R3 비기 (나 · 상대)');
    z('', 14, 12, side, PORT ? 104 : 82, 'L 인물: 이름 · 칭호 · 대사 2줄 (· 카드 안내)');
    z('b', W / 2 - 90, Hh * 0.3 - 16, 180, 32, 'C 상태 (경직)');
    z('', W / 2 - (PORT ? 150 : 180), Hh * 0.46 - 30, PORT ? 300 : 360, 60, 'D 판 알림 (Battle · 승리 · 패배)');
    const hb = PORT ? 12 + 130 : 12;
    const hw = PORT ? W - 28 : Math.min(W * 0.64, 520);
    z('', W / 2 - Math.min(W * 0.64, 480) / 2, Hh - hb - (PORT ? 54 : 34) - 20, Math.min(W * 0.64, 480), 22, 'E 알림 줄 (감정 · 부활 · 센서)');
    z('', W / 2 - hw / 2, Hh - hb - (PORT ? 44 : 26), hw, PORT ? 44 : 26, 'H 안내 (알약)');
    z('x', 20, Hh - 130, 110, 110, '조이스틱');
  }

  if (scene === 'cards') {
    H('<div id="dim"></div>');
    lstack(PORT ? '무기 카드를 한 장 고르세요' : '무기 카드를 한 장 고르세요');
    // 무기 글은 지금 weapons.js 의 글 그대로 (desc · ability)
    // 카드 줄: 왼쪽 위 소개 칸 아래부터 (가로는 소개가 세 줄로 짧아져 지금보다 46px 위에서 시작 → 카드가 커진다)
    const top = PORT ? 150 : 96; // 지금(소개 아래): 가로 142 · 세로 175
    const rowH = innerHeight - top - 12;
    const narrow = PORT;
    const cw = Math.floor(Math.min(230, (innerWidth - 28 - 24) / 3, rowH / (narrow ? 1.6 : 1.15)));
    const ch = Math.floor(Math.min(cw * (narrow ? 2.1 : 1.5), rowH));
    const wide = cw >= 205 && ch >= 300;
    const card = (cls, tier, who, name, sub, tierKo, desc, abil, id) => `<div class="wface ${cls} ${wide ? 'wide' : ''}" style="--tc:var(--tier-${tier});width:${cw}px;height:${ch}px">${who ? `<span class="pill wwho">${who}</span>` : ''}<span class="wthumb" style="background:url(../../public/ui/weapons/${id}.webp) center/contain no-repeat"></span><span class="wname">${name}</span>${sub ? `<span class="wsub">${sub}</span>` : ''}<span class="pill wtier">${tierKo}</span><span class="wdesc">${desc}</span>${abil ? `<span class="wabil">${abil}</span>` : ''}</div>`;
    H(`<div class="row3" style="top:${top}px" data-role="카드 줄">${
      card('picked', 'legend', '내 무기', '엑스칼리버', '', '레전드', '금빛 기운이 감도는 진짜 왕의 검.', '', 'excalibur') +
      card('missed', 'epic', '', '청강검', '', '에픽', '쇠도 진흙처럼 벤다던 전설의 검. 가볍고 빠른 한손 양날검.', '(창천: 무기 절단)', 'qinggang') +
      card('foe', 'rare', '상대 무기', '레이피어', '', '레어', '길고 가는 르네상스 결투검. 가장 빨리 찌르지만 베기는 약하다.', '', 'rapier')
    }</div>`);
  }

  if (scene === 'menu') {
    const rows = [['상대 난이도', '<div class="seg"><span>쉬움</span><span class="on">보통</span><span>어려움</span></div>'], ['조작 흔적 보기', 1], ['자세 이름 보기', 1], ['유파 기술 알림', 1], ['모든 기술 이름 표시 (디버그)', 0], ['비기 화면 번쩍임', 1], ['비기 카메라 연출', 1], ['픽셀 모드 (실험)', 0], ['화면 갱신 60 fps 묶기', 1], ['피 표현', 1], ['소리 <span class="minor">들어보기</span>', 1], ['이동 방식', '<div class="seg"><span class="on">조이스틱</span><span>기울기</span></div>']];
    H(`<div class="overlay"><div class="card" data-role="창"><h1>패배</h1><p class="sub">목을 베였다 · 하인리히: “은화! 은화 어딨어!”</p><div class="rows">${rows.map(([t, v]) => `<div class="row"><span>${t}</span>${typeof v === 'string' ? v : `<span class="toggle ${v ? 'on' : ''}"></span>`}</div>`).join('')}</div><div class="acts"><div class="primary">다시 싸우기</div><div class="secondary">계속하기</div></div></div></div>`);
  }

  if (scene === 'swatch') {
    // 오렌지 후보 넷을 실제 배경의 하늘·돌기둥·모래 자리에 — 위 줄은 외곽선 표준, 아래 줄은 외곽선 없이
    const C = [['#b96648', 'A 견본 #B96648'], ['#c8714e', 'B 패시브 제안 #C8714E'], ['#de7c46', 'C 비기 제안 #DE7C46'], ['#a2553b', 'D 더 짙게 #A2553B']];
    const ys = PORT ? [0.05, 0.5, 0.78] : [0.06, 0.42, 0.72];
    ys.forEach((y, j) => C.forEach(([c, t], i) => {
      const x = PORT ? 12 + (i % 2) * (innerWidth / 2) : 16 + i * (innerWidth / 4);
      const yy = innerHeight * y + (PORT ? Math.floor(i / 2) * 64 : 0);
      H(`<div class="sw" style="left:${x}px;top:${yy}px;color:${c}">Versetzen<small style="color:${c}">${t}</small></div>`);
      H(`<div class="sw raw" style="left:${x}px;top:${yy + 34}px;color:${c}">외곽선 없음</div>`);
    }));
  }
</script>
</body>
</html>
