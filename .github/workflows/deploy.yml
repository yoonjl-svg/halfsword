# main 브랜치에 올라오면 자동으로 빌드해서 GitHub Pages에 올린다.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 생사전 시험판 /saengsa/ — 커밋하지 않고 여기서 빌드한다 (11/21 감사 N-005). 아래 npm run build 가 public/ 을 dist 로 옮길 때 함께 들어간다
      - run: npx vite build --config tools/saengsa_page/vite.config.mjs --base=./ --outDir public/saengsa --emptyOutDir
      # 물리 2.0 시험판 /physics2/ — 새 다리를 본판에 넣기 전에 사장님이 해 보는 하위 경로 (11/25 사장님 '1번도 수행해').
      #  본판 코드는 그대로다: physics-2 가지를 따로 받아, 그 가지의 도구(tools/physics2_page/build.mjs)가 새 다리 패치를 붙인 사본을 빌드한다.
      #  커밋하지 않는다(public/physics2/ 는 .gitignore) · 본 게임 오프라인 저장에서 뺀다(tools/pwa/build.mjs EXCLUDED_DIRS).
      #  이 두 걸음은 실패해도 본판 배포를 막지 않는다(continue-on-error) — 실패하면 시험 페이지만 빠진다. 빈 폴더에 다 지은 뒤에야 public 으로 옮긴다.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: physics-2
          path: .p2
      - name: physics2 trial page
        continue-on-error: true
        run: |
          cd .p2
          npm ci
          node tools/physics2_page/build.mjs "$RUNNER_TEMP/physics2"
          rm -rf ../public/physics2
          cp -r "$RUNNER_TEMP/physics2" ../public/physics2
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
