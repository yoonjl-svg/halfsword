# main 브랜치에 올라오면 자동으로 빌드해서 GitHub Pages에 올린다.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 바꿔야 한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 생사전 시험판 /saengsa/ — 커밋하지 않고 여기서 빌드한다 (11/21 감사 N-005). 아래 npm run build 가 public/ 을 dist 로 옮길 때 함께 들어간다
      - run: npx vite build --config tools/saengsa_page/vite.config.mjs --base=./ --outDir public/saengsa --emptyOutDir
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
